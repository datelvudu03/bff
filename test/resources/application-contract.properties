#debug=true

management.server.port=${dynamic.management.server.port}

kb.speed.feature.tracing.zipkin.enabled=false
kb.speed.feature.redis-client.enabled=false
kb.speed.feature.cache.redis.enabled=false

# these are too verbose even for tests
logging.level.cz.kb.speed=debug
logging.level.cz.kb.speed.messaging.core.interceptor=info
logging.level.cz.kb.speed.messaging.spi.synchronization=info
logging.level.cz.kb.speed.fsm.core.DefaultFsm=info
logging.level.io.zonky=debug
logging.level.org.springframework.jdbc=trace
logging.level.org.springframework=debug

leon.servicing.zone-id.prague=Europe/Prague
cob.start = 00:00:00
cob.end = 00:30:00

#Datasource test
spring.flyway.enabled=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

