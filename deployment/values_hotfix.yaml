replicaCount: 1
imagePullPolicy: Always
isDynamicEnvironment: true

# Structured configuration
config:
  conjur:
    accountNames:
      flagsmithApiKey: flagsmithApiKeyFAT
      positionKeepingServiceUser: positionKeepingServiceUser
  application:
    cob:
      start: "19:00:00"
      end: "22:00:00"
    caas:
      host: https://uat1-caas.kb.cz
    kbDebugLevel: DEBUG
    restLoggingLevel: INFO
    restLoggingEnabled: true
    corsAllowedOrigins: "*"
    services:
      rest:
        bcServicing:
          host: http://bc-servicing-v1.config-fix.review.leon.kbcloud
        permission:
          host: https://mockserver.devtools.leon.kbcloud/api/governance-engine
          suppressDetailResponse: false
        plc:
          # host: http://bc-productlifecycle-v1.fat.leon.kbcloud
          host: http://vncub27265.os.kb.cz:31151 # Mocked PLC
        t24:
          host: https://ti-leon-servicing.sit.t24.kbcloud/loans
        nca:
          host: https://bc-accountservicing-v1.stage.nca.kbcloud
        positionKeeping:
          host: https://core-banking-sit.kb.cz
        prd:
          host: https://bc-productdefinition-v1.fat.leon.kbcloud
        pricing:
          host: http://vncub27265.os.kb.cz:31151

serviceDebug:
  enabled: true
  servicePort: 8000
  # Fill port used in agentlib address
  targetPort: 8000
  # Use unique port for each component
  nodePort:

resources:
  requests:
    memory: 350Mi
    cpu: 150m
  limits:
    memory: 500Mi
    cpu: '1'

secretData:
  truststore.jks: ""
  keystore.jks: ""
